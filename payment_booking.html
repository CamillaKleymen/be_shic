<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment & Booking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="bg-light py-3">
        <div class="container-fluid px-5 d-flex justify-content-between align-items-center">
            <a class="navbar-brand" href="#">
                <h1 class="fw-bold display-6 text-gray mb-0">Be Shic</h1>
                <p class="text-muted
                    fs-4 mb-0">hostel</p>
            </a>
            <div class="d-flex align-items-center">
                <select class="form-select me-2">
                    <option>English</option>
                    <option>Русский</option>
                </select>
                <select class="form-select me-2">
                    <option>USD</option>
                    <option>EUR</option>
                </select>
                <button class="btn btn-light"><i class="bi bi-person fs-4"></i></button>
            </div>
        </div>
    </header>

    <section class="bg-light py-3">
        <div class="container-fluid px-5">
            <nav>
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item text-muted fs-5">Home-Booking</li>
                </ol>
            </nav>
        </div>
    </section>

    <section class="container-fluid px-5 my-4">
        <div class="row g-3">
            <div class="col-md-4">
                <label class="fw-bold">Check-in</label>
                <input type="date" class="form-control">
            </div>
            <div class="col-md-4">
                <label class="fw-bold">Check-out</label>
                <input type="date" class="form-control">
            </div>
            <div class="col-md-3">
                <label class="fw-bold">Guests</label>
                <select class="form-select">
                    <option>1 guest</option>
                    <option>2 guests</option>
                    <option>3 guests</option>
                </select>
            </div>
            <div class="col-md-1 d-flex align-items-end">
                <button class="btn btn-dark w-100">Search →</button>
            </div>
        </div>
    </section>

    <section class="container-fluid px-5 py-4 bg-light">
        <h2 class="fw-bold">Contact & Payment Details</h2>
        <div class="row mt-3">
            <div class="col-md-6">
                <button class="btn btn-light w-100 fw-medium fs-5">I'm booking myself</button>
            </div>
            <div class="col-md-6">
                <button class="btn btn-light w-100 fw-medium fs-5">I'm booking for someone else</button>
            </div>
        </div>
    </section>

    <section class="container-fluid px-5 my-4">
        <h4>Enter your contact details</h4>
        <div class="row g-0 mt-2">
            <div class="col-md-6">
                <label class="fw-bold">First name</label>
                <input type="text" class="form-control w-50" placeholder="Enter">
            </div>
            <div class="col-md-6">
                <label class="fw-bold">Last name</label>
                <input type="text" class="form-control w-50" placeholder="Enter">
            </div>
            <div class="col-md-6">
                <label class="fw-bold">Email</label>
                <input type="email" class="form-control w-50" placeholder="Enter">
            </div>
            <div class="col-md-6">
                <label class="fw-bold">Phone</label>
                <input type="text" class="form-control w-50" placeholder="+">
            </div>
        </div>
    </section>


    <section class="container-fluid px-5">
        <!-- Payment Section -->
        <div class="bg-light p-4 rounded mb-4">
            <h3 class="fw-bold">Payment</h3>
            <div class="mb-3">
                <label class="form-label">We accept cards:</label>
                <div>
                    <img src="images/icons/visa.png" alt="Visa" class="me-2">
                    <img src="images/icons/mastercard.png" alt="MasterCard" class="me-2">
                    <img src="images/icons/unionpay .png" alt="UnionPay">
                </div>
            </div>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Payment card number</label>
                    <input type="text" class="form-control" placeholder="Enter">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Expiration (MM/YY)</label>
                    <input type="text" class="form-control" placeholder="Enter">
                </div>
                <div class="col-md-6">
                    <label class="form-label">CVV</label>
                    <input type="text" class="form-control" placeholder="Enter">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Name on card</label>
                    <input type="text" class="form-control" placeholder="Enter">
                </div>
            </div>
        </div>
    
        <!-- Total Section -->
        <div class="bg-light p-4 rounded">
            <h3 class="fw-bold text-dark">Total</h3>
            <div class="mb-3">
                <p class="text-dark fw-bold">Bed in Squad (8) + Today`s Rate - Non Refundable</p>
                <p>1 * €32.00</p>
                <p class="text-dark fw-bold">Products and extras</p>
                <p>City Tax 2025</p>
                <p>2 * €1.20</p>
                <p class="text-dark fw-bold">MWST 7%</p>
            </div>
            <div class="d-flex justify-content-between fw-bold fs-4">
                <span>Total</span>
                <span>80.40$</span>
            </div>
            <p class="text-muted">per room / nightly</p>
            <button class="btn btn-dark w-100 py-2 mt-3">Confirm</button>
        </div>
    </section>
    

    <!-- js connections -->
    <script src="js/script.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
